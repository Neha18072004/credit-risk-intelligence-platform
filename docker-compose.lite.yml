# ===========================================================================
# Lightweight deployment profile.
#
#   docker compose -f docker-compose.lite.yml up
#
# Two services instead of three: the app and PostgreSQL, with no local model
# runtime. That removes roughly 9GB (a 4.2GB Ollama image plus a 4.7GB model)
# and the ~6GB of RAM the model needs resident, which is what makes the full
# stack impossible to run on a small cloud instance.
#
# Everything still works: the app serves the committed model trained on all
# 307,511 rows, so scoring, SHAP explanations, the policy rules and the audit
# trail are all immediate. Only the chat needs a decision:
#
#   * Set a hosted provider and its key (below) and the chat works as normal.
#   * Set nothing and the chat reports itself unavailable with a clear message
#     while every other section carries on. Nothing crashes.
#
# Resource footprint: ~1.8GB of images, comfortably under 1GB RAM at rest.
# ===========================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: crp-lite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-credit_readonly}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-readonly_pass_change_me}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-15}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-readonly.sh:/docker-entrypoint-initdb.d/10-init-readonly.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credit} -d ${POSTGRES_DB:-credit_risk}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crp-lite-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_MODE: ${DATA_MODE:-sample}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-credit_readonly}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-readonly_pass_change_me}
      # No local runtime here. Choose a hosted provider and supply its key, or
      # leave as-is and the Chat tab explains that it is unavailable.
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-200}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-15}
      MEMORY_MAX_TURNS: ${MEMORY_MAX_TURNS:-6}
    volumes:
      - ./data:/app/data
    ports:
      - "${STREAMLIT_PORT_HOST:-8501}:8501"

volumes:
  postgres_data:
    driver: local
